<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">左人笔记 EPUB 阅读界面示意</title>
  <desc id="desc">构成主义风格的 EPUB 双页阅读界面，展示章节目录、双页排版、翻页和全书搜索。</desc>
  <rect width="1200" height="650" rx="18" fill="#eee9da"/>
  <rect width="1200" height="60" rx="18" fill="#111"/><rect y="40" width="1200" height="20" fill="#111"/>
  <text x="26" y="39" fill="#f5f0df" font-family="sans-serif" font-size="21" font-weight="700">左人笔记</text>
  <rect x="149" y="12" width="82" height="36" rx="4" fill="#c9232d"/><text x="167" y="36" fill="#fff8e7" font-family="sans-serif" font-size="16" font-weight="700">阅读</text>
  <text x="254" y="36" fill="#d9d3c5" font-family="sans-serif" font-size="16">笔记</text><text x="324" y="36" fill="#d9d3c5" font-family="sans-serif" font-size="16">对照</text>
  <text x="926" y="36" fill="#d9d3c5" font-family="sans-serif" font-size="15">EPUB 双页阅读</text>
  <rect y="60" width="250" height="590" fill="#e4dece"/>
  <text x="24" y="104" fill="#111" font-family="sans-serif" font-size="18" font-weight="700">本书目录</text>
  <rect x="14" y="124" width="222" height="38" rx="5" fill="#fbf8ed"/><text x="30" y="149" fill="#736b5c" font-family="sans-serif" font-size="14">⌕ 搜索全书</text>
  <text x="27" y="202" fill="#514b40" font-family="sans-serif" font-size="14">引言</text>
  <text x="27" y="240" fill="#514b40" font-family="sans-serif" font-size="14">第一章　问题的提出</text>
  <rect x="14" y="258" width="222" height="40" rx="5" fill="#c9232d"/><text x="27" y="284" fill="#fff8e7" font-family="sans-serif" font-size="14" font-weight="700">第二章　社会生活</text>
  <text x="41" y="328" fill="#514b40" font-family="sans-serif" font-size="13">第一节　共同活动</text>
  <text x="41" y="363" fill="#514b40" font-family="sans-serif" font-size="13">第二节　社会关系</text>
  <text x="27" y="407" fill="#514b40" font-family="sans-serif" font-size="14">第三章　实践与认识</text>
  <rect x="250" y="60" width="950" height="52" fill="#f7f3e8"/>
  <text x="278" y="93" fill="#514b40" font-family="sans-serif" font-size="15">第二章　社会生活</text>
  <text x="784" y="93" fill="#514b40" font-family="sans-serif" font-size="15">−　100%　＋　　‹　翻页　›　　⌕</text>
  <rect x="250" y="112" width="950" height="538" fill="#d4d0c5"/>
  <rect x="343" y="140" width="750" height="474" rx="3" fill="#fffdf5"/>
  <line x1="718" y1="158" x2="718" y2="596" stroke="#ddd4c2"/>
  <text x="389" y="184" fill="#c9232d" font-family="serif" font-size="19" font-weight="700">第二章　社会生活</text>
  <g fill="#37332c" font-family="serif" font-size="13">
    <text x="389" y="225">人们在日常生活中建立联系，</text><text x="389" y="249">这些联系并非孤立存在，而是</text><text x="389" y="273">在共同活动中逐渐形成。</text>
    <text x="389" y="321">观察一种社会现象，既要看到</text><text x="389" y="345">个体的经验，也要追问经验背后</text><text x="389" y="369">的制度、资源与历史条件。</text>
    <text x="389" y="417">阅读时留下的问题，常常会成</text><text x="389" y="441">为继续调查和讨论的起点。</text>
    <text x="389" y="489">把重要段落摘录到笔记中，再</text><text x="389" y="513">补上自己的理解与待办事项。</text>
  </g>
  <text x="757" y="184" fill="#c9232d" font-family="serif" font-size="17" font-weight="700">共同活动与社会关系</text>
  <g fill="#37332c" font-family="serif" font-size="13">
    <text x="757" y="225">共同活动让分散的行动彼此</text><text x="757" y="249">连接，也使人们能够积累经验、</text><text x="757" y="273">传递知识并改变周围环境。</text>
    <text x="757" y="321">对文本的理解不止于一句话，</text><text x="757" y="345">还需要把它放回章节脉络，</text><text x="757" y="369">联系前后论述再作判断。</text>
    <text x="757" y="417">目录、搜索和阅读位置恢复，</text><text x="757" y="441">帮助读者在长篇材料中继续阅读。</text>
    <text x="757" y="489">选中内容后，可以复制、标注，</text><text x="757" y="513">或摘录到当前笔记继续整理。</text>
  </g>
  <text x="676" y="592" fill="#857c6b" font-family="sans-serif" font-size="12">左页 · 章节阅读　　右页 · 连续阅读</text>
</svg>
