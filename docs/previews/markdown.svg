<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">左人笔记 Markdown 编辑界面示意</title>
  <desc id="desc">构成主义风格的桌面笔记界面，左侧为文件栏，中间编辑 Markdown，右侧显示格式预览。</desc>
  <rect width="1200" height="650" rx="18" fill="#f5f0df"/>
  <rect x="0" y="0" width="1200" height="62" rx="18" fill="#111"/>
  <rect x="0" y="42" width="1200" height="20" fill="#111"/>
  <rect x="20" y="14" width="34" height="34" rx="7" fill="#c9232d"/>
  <path d="M28 22h17v18H28z" fill="#f5e8bd"/><path d="M31 27h11M31 31h11M31 35h7" stroke="#111" stroke-width="2"/>
  <text x="68" y="40" fill="#f5f0df" font-family="sans-serif" font-size="22" font-weight="700">左人笔记</text>
  <text x="1015" y="39" fill="#f5f0df" font-family="sans-serif" font-size="16">Markdown · Live Preview</text>
  <rect x="0" y="62" width="220" height="588" fill="#e8e0ca"/>
  <text x="24" y="105" fill="#111" font-family="sans-serif" font-size="19" font-weight="700">笔记库</text>
  <rect x="12" y="126" width="196" height="40" rx="6" fill="#f5f0df" stroke="#c9c0aa"/>
  <text x="28" y="152" fill="#777064" font-family="sans-serif" font-size="15">搜索笔记</text>
  <rect x="12" y="187" width="196" height="42" rx="5" fill="#c9232d"/>
  <text x="30" y="214" fill="#fff8e7" font-family="sans-serif" font-size="16" font-weight="700">●  项目计划.md</text>
  <text x="34" y="261" fill="#514b40" font-family="sans-serif" font-size="15">○  阅读摘录.md</text>
  <text x="34" y="302" fill="#514b40" font-family="sans-serif" font-size="15">○  随手记.md</text>
  <rect x="220" y="62" width="490" height="588" fill="#fbf8ed"/>
  <text x="252" y="105" fill="#756d5e" font-family="sans-serif" font-size="14">项目计划.md</text>
  <line x1="252" y1="122" x2="678" y2="122" stroke="#d8d0bd"/>
  <text x="252" y="174" fill="#c9232d" font-family="sans-serif" font-size="27" font-weight="700"># 本周计划</text>
  <text x="252" y="220" fill="#111" font-family="sans-serif" font-size="19">把阅读中的想法，整理成可继续推进的笔记。</text>
  <text x="252" y="275" fill="#111" font-family="sans-serif" font-size="18">- [x] 整理资料目录</text>
  <text x="252" y="316" fill="#111" font-family="sans-serif" font-size="18">- [ ] 阅读并标注重点</text>
  <text x="252" y="357" fill="#111" font-family="sans-serif" font-size="18">- [ ] 写下下一步行动</text>
  <rect x="252" y="395" width="426" height="2" fill="#111"/>
  <text x="252" y="438" fill="#111" font-family="sans-serif" font-size="18" font-weight="700">## 阅读摘录</text>
  <text x="252" y="478" fill="#514b40" font-family="sans-serif" font-size="17">> 重要的不是收集更多材料，</text>
  <text x="252" y="510" fill="#514b40" font-family="sans-serif" font-size="17">> 而是让材料彼此发生联系。</text>
  <rect x="710" y="62" width="490" height="588" fill="#f1ead7"/>
  <text x="744" y="105" fill="#756d5e" font-family="sans-serif" font-size="14">预览</text>
  <line x1="744" y1="122" x2="1168" y2="122" stroke="#d2c8b2"/>
  <text x="744" y="178" fill="#111" font-family="serif" font-size="34" font-weight="700">本周计划</text>
  <text x="744" y="221" fill="#514b40" font-family="serif" font-size="18">把阅读中的想法，整理成可继续推进的笔记。</text>
  <rect x="744" y="255" width="18" height="18" fill="#c9232d"/><path d="m748 264 5 5 9-11" fill="none" stroke="#fff8e7" stroke-width="2.5"/>
  <text x="778" y="271" fill="#514b40" font-family="serif" font-size="18">整理资料目录</text>
  <rect x="744" y="296" width="18" height="18" fill="none" stroke="#817967" stroke-width="2"/>
  <text x="778" y="312" fill="#514b40" font-family="serif" font-size="18">阅读并标注重点</text>
  <rect x="744" y="337" width="18" height="18" fill="none" stroke="#817967" stroke-width="2"/>
  <text x="778" y="353" fill="#514b40" font-family="serif" font-size="18">写下下一步行动</text>
  <rect x="744" y="396" width="4" height="108" fill="#c9232d"/>
  <text x="766" y="426" fill="#514b40" font-family="serif" font-size="18">重要的不是收集更多材料，</text>
  <text x="766" y="458" fill="#514b40" font-family="serif" font-size="18">而是让材料彼此发生联系。</text>
  <text x="744" y="608" fill="#8a806d" font-family="sans-serif" font-size="13">构成主义主题 · 编辑与预览并行</text>
</svg>
